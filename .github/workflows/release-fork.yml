name: Release Fork

# Build Ghostty.app from main and publish it as the newest release. The
# nix-darwin flake in the dotfiles repo installs it from
# releases/latest/download/Ghostty.dmg.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-fork
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ykhateeb/ghostty'
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # The build skips translations without gettext, but it still needs
      # the locale directory.
      - name: Build Ghostty.app
        run: |
          mkdir -p zig-out/share/locale
          zig build -Doptimize=ReleaseFast -Di18n=false

      - name: Make the DMG
        run: |
          hdiutil create -volname Ghostty -fs HFS+ -format UDZO \
            -srcfolder macos/build/ReleaseLocal/Ghostty.app Ghostty.dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="fork-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::9}"
          gh release create "$tag" Ghostty.dmg \
            --target "$GITHUB_SHA" --latest --title "$tag" \
            --notes "Ghostty.app built from $GITHUB_SHA."
