name: Release Fork

# Build Ghostty.app from main, publish it as the newest release, and write
# its URL and hash to ghostty.json on the release-info branch. The
# nix-darwin flake in the dotfiles repo installs the app from that file.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-fork
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ykhateeb/ghostty'
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # The build skips translations without gettext, but it still needs
      # the locale directory.
      - name: Build Ghostty.app
        run: |
          mkdir -p zig-out/share/locale
          zig build -Doptimize=ReleaseFast -Di18n=false

      # The build signs the app ad-hoc, so macOS forgets its Screen Recording
      # and Accessibility permissions after each new release. A signature
      # from one fixed certificate keeps the permissions. The certificate is
      # self-signed: it has no Team ID, so the app keeps its entitlements
      # (disable-library-validation lets it load Sparkle).
      - name: Sign Ghostty.app
        env:
          CERTIFICATE: ${{ secrets.FORK_SIGNING_CERTIFICATE }}
          CERTIFICATE_PWD: ${{ secrets.FORK_SIGNING_CERTIFICATE_PWD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pwd="$(openssl rand -hex 16)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pwd" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$kc_pwd" "$kc"
          # codesign finds the identity only in a keychain on the search list.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pwd" "$kc" > /dev/null
          rm "$RUNNER_TEMP/cert.p12"
          id="$(security find-identity -p codesigning "$kc" | awk '$1 == "1)" { print $2; exit }')"

          app=macos/build/ReleaseLocal/Ghostty.app
          sparkle="$app/Contents/Frameworks/Sparkle.framework"
          # Sign the inner parts first and the app last.
          for path in \
            "$sparkle/Versions/B/XPCServices/Downloader.xpc" \
            "$sparkle/Versions/B/XPCServices/Installer.xpc" \
            "$sparkle/Versions/B/Autoupdate" \
            "$sparkle/Versions/B/Updater.app" \
            "$sparkle" \
            "$app/Contents/PlugIns/DockTilePlugin.plugin" \
            "$app"; do
            codesign --force --keychain "$kc" --sign "$id" \
              --options runtime --preserve-metadata=entitlements "$path"
          done
          codesign --verify --deep --strict "$app"
          codesign -d -r- "$app"
          security delete-keychain "$kc"

      - name: Make the DMG
        run: |
          hdiutil create -volname Ghostty -fs HFS+ -format UDZO \
            -srcfolder macos/build/ReleaseLocal/Ghostty.app Ghostty.dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="fork-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::9}"
          gh release create "$tag" Ghostty.dmg \
            --target "$GITHUB_SHA" --latest --title "$tag" \
            --notes "Ghostty.app built from $GITHUB_SHA."
          echo "TAG=$tag" >> "$GITHUB_ENV"

      # The flake reads ghostty.json from the release-info branch. The tag
      # URL and the hash never change, so the flake lock stays valid.
      - name: Update release-info
        run: |
          if git fetch -q --depth=1 origin release-info; then
            git worktree add info FETCH_HEAD
          else
            git worktree add --orphan -b release-info info
          fi
          hash="sha256-$(openssl dgst -sha256 -binary Ghostty.dmg | base64)"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Ghostty.dmg"
          printf '{\n  "url": "%s",\n  "hash": "%s"\n}\n' "$url" "$hash" > info/ghostty.json
          cd info
          git add ghostty.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Release $TAG"
          git push -q origin HEAD:release-info
